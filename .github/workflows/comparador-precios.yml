name: Comparador de precios

on:
  schedule:
    - cron: "17 11 * * *"   # todos los días a las 6:17 a. m. (hora de Colombia)
  workflow_dispatch:         # botón "Run workflow" para ejecutarlo a mano

permissions:
  contents: write

concurrency:
  group: comparador-precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: comparador/scraper/requirements.txt

      - name: Instalar dependencias
        run: pip install -r comparador/scraper/requirements.txt pytest

      - name: Pruebas
        run: python -m pytest -q comparador/scraper/tests

      - name: Consultar tiendas y comparar
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}   # opcional
          FIRECRAWL_MAX_DIA: "100"
        run: python comparador/scraper/comparar.py

      - name: Guardar resultados
        run: |
          if git diff --quiet -- comparador/data/precios.json; then
            echo "Sin cambios"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add comparador/data/precios.json
          git commit -m "Comparador: actualizar precios"
          git push
